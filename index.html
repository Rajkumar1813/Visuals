<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inquiries Video Visuals (1:1)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b1020}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#cfd6f5;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;display:flex;justify-content:center}
.w{width:100%;max-width:560px;padding:10px}
.st{position:relative;width:100%;aspect-ratio:1;container-type:inline-size;overflow:hidden;border-radius:12px;background-color:#0b1020;background-image:radial-gradient(circle at 50% 25%,#1c2656 0,transparent 70%),linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:100% 100%,4cqw 4cqw,4cqw 4cqw;box-shadow:0 0 0 1px #2b3354,0 10px 40px #000a;animation:gm 6s linear infinite}@keyframes gm{to{background-position:0 0,0 4cqw,4cqw 0}}
.c{position:absolute;border:.4cqw solid var(--c);border-radius:2cqw;background:#161b2e;box-shadow:0 0 3cqw color-mix(in srgb,var(--c) 45%,transparent);overflow:hidden;display:flex;flex-direction:column}
.c>b{display:flex;justify-content:space-between;align-items:center;background:var(--c);color:#0b0f1d;font-size:3.2cqw;padding:.8cqw 2cqw}
.bd{flex:1;display:flex;align-items:center;justify-content:center;gap:3.2cqw;flex-direction:column;padding:1cqw 2cqw;color:var(--c);font-size:3cqw}
.bd.r{flex-direction:row}
.i{width:7cqw;height:7cqw;fill:currentColor}
.big{font-size:8cqw;font-weight:700;color:var(--c)}
.pd,.pd2{width:2cqw;height:2cqw;border-radius:50%;background:#ff5a4d;display:inline-block;animation:pu 1s infinite}
@keyframes pu{50%{opacity:.3;transform:scale(1.6)}}
.ln{height:1.6cqw;background:#2b3354;border-radius:1cqw;width:80%}
.dot{position:absolute;width:2.4cqw;height:2.4cqw;border-radius:50%;background:#ff5a4d;box-shadow:0 0 2cqw #ff5a4d;left:49cqw;top:22cqw;animation:fall 1.2s linear infinite}
@keyframes fall{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(13cqw);opacity:0}}
.pill{position:absolute;padding:1.2cqw 2.4cqw;border-radius:5cqw;border:.4cqw solid var(--c);color:var(--c);background:#161b2e;font-size:3cqw;box-shadow:0 0 3cqw color-mix(in srgb,var(--c) 45%,transparent)}
.q{font-size:4.6cqw;line-height:1;font-weight:700;color:#ff5a4d;animation:pu .9s infinite}
.u2{position:absolute;left:3cqw;top:8cqw;width:9cqw;height:9cqw;border-radius:50%;background:#6b86ff;color:#0b0f1d;display:flex;align-items:center;justify-content:center;box-shadow:0 0 3cqw #6b86ff;animation:uk 12s infinite}
@keyframes uk{0%,6%{transform:translate(0,0);opacity:0}10%{opacity:1;transform:translate(0,0)}55%{transform:translate(0,50cqw)}63%{transform:translate(0,76cqw)}85%{transform:translate(67cqw,76cqw);opacity:1}92%,100%{transform:translate(67cqw,76cqw);opacity:0}}
.row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:1.6cqw 2.4cqw;border:.3cqw solid #2dd4bf;border-radius:1.6cqw;background:#10162a;color:#2dd4bf;font-size:3.2cqw}
.tk{width:5cqw;height:5cqw;border-radius:50%;background:#34d399;color:#0b0f1d;display:flex;align-items:center;justify-content:center}
.tk svg{width:3.4cqw;height:3.4cqw;fill:none;stroke:currentColor;stroke-width:3}
.glow{animation-name:none}
.ty{display:inline-block;overflow:hidden;white-space:nowrap;width:0;border-right:.5cqw solid #6b86ff;font-size:5cqw;color:#e6eaff;animation:tp 12s steps(9) infinite}
@keyframes tp{0%,5%{width:0}20%,100%{width:9ch}}
.bar{position:absolute;bottom:0;width:30%;border-radius:1cqw 1cqw 0 0;transform-origin:bottom}
.ar{color:#34d399;font-size:5cqw}.c::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#ffffff22 50%,transparent 60%);transform:translateX(-100%);animation:sh 3.5s infinite;pointer-events:none;z-index:2}@keyframes sh{60%,100%{transform:translateX(100%)}}.c::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 3cqw color-mix(in srgb,var(--c) 35%,transparent);animation:gl 2.4s ease-in-out infinite;pointer-events:none}@keyframes gl{50%{opacity:.3}}.c>b:not(:has(i))::after{content:"";width:1.5cqw;height:1.5cqw;border-radius:50%;background:#0b0f1d99}.big{text-shadow:0 0 2.5cqw currentColor}.bar::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(#ffffff55,transparent 70%)}.pt{position:absolute;bottom:-3cqw;width:.8cqw;height:.8cqw;border-radius:50%;background:#6b86ff;opacity:0;animation:rise linear infinite}@keyframes rise{10%{opacity:.7}100%{transform:translateY(-110cqw);opacity:0}}.chip{position:absolute;left:2cqw;top:1.6cqw;z-index:5;font-size:2.4cqw;letter-spacing:.3cqw;color:#9fb0ff;background:#161b2eee;border:.3cqw solid #6b86ff66;padding:.6cqw 1.6cqw;border-radius:3cqw}.pg{position:absolute;left:0;top:0;height:.9cqw;background:linear-gradient(90deg,#6b86ff,#b57cff,#2dd4bf);z-index:6;animation:pgr linear infinite;box-shadow:0 0 2cqw #b57cff}@keyframes pgr{from{width:0}to{width:100%}}
#cap{margin:10px 2px;font-size:14px;min-height:40px}
#tb{display:flex;gap:6px;flex-wrap:wrap}
:root.rec{padding:0}.rec body{min-height:100vh;align-items:center}.rec .w{max-width:none;padding:0}.rec .chip,.rec .pg{display:none}.rec #cap,.rec #tb{display:none}.rec .st{border-radius:0;box-shadow:none;width:min(100vw,100vh)}button{font:inherit;background:#161b2e;color:#cfd6f5;border:1px solid #2b3354;border-radius:8px;padding:8px 12px}
button.on{background:#6b86ff;color:#0b0f1d;border-color:#6b86ff}
.st{background:none!important;box-shadow:none!important;animation:none!important;border-radius:0}.pt,.chip,.pg{display:none!important}.w{max-width:600px;padding:0}#cap,#tb{margin:10px}:root{--bg:#000}</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="u" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></symbol>
<symbol id="env" viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 011 1v12a1 1 0 01-1 1H3a1 1 0 01-1-1V6a1 1 0 011-1zm1.5 2.2L12 13l7.5-5.8-.9-1.2L12 11 5.4 6z"/></symbol>
</defs></svg>
<div class="w"><div id="s" class="st"></div><div id="cap"></div><div id="tb"></div></div>
<script>
const ck='<span class="tk"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></span>';
const ic=(n,s='')=>`<svg class="i" ${s} viewBox="0 0 24 24"><use href="#${n}"/></svg>`;
const col={b:'#6b86ff',p:'#b57cff',t:'#2dd4bf',r:'#ff5a4d',g:'#34d399'};
const C=(c,x,y,w,h,t,body,ex='',bc='')=>`<div class="c" style="--c:${col[c]};left:${x}cqw;top:${y}cqw;width:${w}cqw;height:${h}cqw" ${ex}><b>${t}</b><div class="bd ${bc}">${body}</div></div>`;
const L=n=>'<div class="ln"></div>'.repeat(n);
const N=(a,b,n,o='')=>`<span class="big" data-a="${a}" data-b="${b}" data-n="${n}" ${o}>0</span>`;
const S=[
{d:6,cap:'1. Hook — friend ki website, par inquiries 0',h:
 C('p',18,6,64,38,"Friend's Website",L(3),'data-r="0.2"')+
 C('r',30,54,40,30,'Inquiries <i class="pd"></i>','<span class="big" style="color:#ff5a4d">0</span><small>No inquiries</small>','data-r="1.5"')},
{d:10,cap:'2. 3000 visitors → sirf 24 inquiries (0.8%)',h:
 C('b',30,2,40,20,'Users',ic('u')+N(.5,4,3000),'data-r="0"','r')+
 '<i class="dot"></i><i class="dot" style="animation-delay:.4s;left:45cqw"></i><i class="dot" style="animation-delay:.8s;left:53cqw"></i>'+
 C('p',25,36,50,14,'Website','<small>visitors aa rahe hain</small>','data-r="1"')+
 '<svg style="position:absolute;left:25cqw;top:52cqw;width:50cqw;height:12cqw" viewBox="0 0 100 24" data-r="5"><polygon points="0,0 100,0 60,24 40,24" fill="#b57cff33" stroke="#b57cff" stroke-width=".8"/></svg>'+
 C('g',30,66,40,22,'Inquiries',N(7,9,24),'data-r="6.5"')+
 '<div class="pill" style="--c:#ff5a4d;left:72cqw;top:72cqw" data-r="9">Conversion 0.8%</div>'},
{d:12,cap:'3. User 3 pages scroll karta hai, info nahi milti → Exit',h:
 [6,30,54].map((y,i)=>C('p',12,y,34,18,'Page '+(i+1),L(2),`data-r="${.3+i*.3}"`)).join('')+
 [['What you do',2],['Services',3.6],['Pricing',5.2],['Trust',6.8]].map((a,i)=>C('t',58,6+i*21,38,13,a[0],'<span class="q">?</span>',`data-r="${a[1]}"`)).join('')+
 `<div class="u2">${ic('u','style="width:6cqw;height:6cqw"')}</div>`+
 '<div class="pill" style="--c:#ff5a4d;left:80cqw;top:85cqw" data-r="8.2">EXIT ➜</div>'},
{d:10,cap:'4. Solution — ek simple, clean page par saari info',h:
 C('p',8,6,84,72,'One Clean Page',
 [['What we do',1],['Services',2.4],['Pricing',3.8],['Why trust us',5.2]].map(a=>`<div class="row" data-r="${a[1]}">${a[0]}<span data-r="${a[1]+.8}">${ck}</span></div>`).join(''),'data-r="0"')+
 '<div class="pill" style="--c:#34d399;left:28cqw;top:84cqw;font-size:3.6cqw" data-r="7.5">Simple + Premium ✦</div>'},
{d:12,cap:'5. Growth — 0.8% → 1.3%+, 24 → 39+ inquiries (visitors 3000 fixed)',h:
 '<div class="pill" style="--c:#6b86ff;left:30cqw;top:2cqw" data-r="0.2">Visitors: 3000 (same)</div>'+
 C('p',6,12,40,72,'Conversion','<div style="position:relative;width:100%;height:100%">'+
  '<div class="bar" style="left:8%;height:55%;background:#ff5a4d" data-r="1" data-k="g"></div>'+
  '<div class="bar" style="left:58%;height:88%;background:#34d399" data-r="4" data-k="g"></div></div>'+
  '<div style="display:flex;justify-content:space-around;width:100%"><span>0.8%</span><span class="big" style="font-size:4.5cqw" data-a="4" data-b="6" data-f="0.8" data-n="1.3" data-d="1" data-s="%">0.8</span></div>','data-r="0.5"')+
 C('g',54,12,40,72,'Inquiries','<div style="position:relative;width:100%;height:100%">'+
  '<div class="bar" style="left:8%;height:55%;background:#ff5a4d" data-r="1.5" data-k="g"></div>'+
  '<div class="bar" style="left:58%;height:88%;background:#34d399" data-r="5" data-k="g"></div></div>'+
  '<div style="display:flex;justify-content:space-around;width:100%"><span>24</span><span class="big" style="font-size:4.5cqw" data-a="5" data-b="7" data-f="24" data-n="39" data-s="+">24</span></div>','data-r="0.5"')+
 '<div class="pill" style="--c:#34d399;left:38cqw;top:88cqw" data-r="7.5"><span class="ar">▲</span> +15 inquiries</div>'},
{d:12,cap:'6. CTA — comment "inquiries" → DM me free guide',h:
 C('b',12,8,76,20,'Comment','<span class="ty">inquiries</span>','data-r="0"')+
 '<div style="position:absolute;left:46cqw;top:30cqw;font-size:6cqw;color:#6b86ff" data-r="5">▼</div>'+
 C('p',12,42,76,44,'DM',ic('env','style="width:12cqw;height:12cqw"')+'<span style="font-size:4cqw">Free Guide</span>','data-r="5.5"')+
 '<div style="position:absolute;left:74cqw;top:62cqw" data-r="7.5">'+ck.replace('class="tk"','class="tk" style="width:8cqw;height:8cqw"')+'</div>'}
];
const st=document.getElementById('s'),cap=document.getElementById('cap'),tb=document.getElementById('tb');
let cur=0,t0=0,auto=true,kf=document.createElement('style');document.head.appendChild(kf);
S.forEach((_,i)=>{const b=document.createElement('button');b.textContent=i+1;b.onclick=()=>{auto=false;pa.classList.remove('on');load(i)};tb.appendChild(b)});
const pa=document.createElement('button');pa.textContent='▶ Play all';pa.className='on';pa.onclick=()=>{auto=!auto;pa.classList.toggle('on',auto);load(cur)};tb.appendChild(pa);const rb=document.createElement('button');rb.textContent='🎬 Record mode';rb.onclick=()=>{auto=true;document.documentElement.classList.add('rec');load(0)};tb.appendChild(rb);st.onclick=()=>{document.documentElement.classList.remove('rec')};const bb=document.createElement('button');let bi=0;const BG=[['Black','#000'],['Green','#00b140']];bb.textContent='BG: Black';bb.onclick=()=>{bi=(bi+1)%2;document.documentElement.style.setProperty('--bg',BG[bi][1]);bb.textContent='BG: '+BG[bi][0]};tb.appendChild(bb);
function load(i){cur=i;const sc=S[i],d=sc.d;st.innerHTML=`<div style="position:absolute;inset:0;transform:${['translateY(3cqw) scale(1.05)','translate(-10cqw,4cqw) scale(.98)','translateY(1cqw) scale(.92)','translateY(2cqw) scale(.95)','scale(.94)','translateY(3cqw) scale(1.05)'][i]}">${sc.h}</div>`;cap.textContent=sc.cap;st.insertAdjacentHTML('afterbegin',Array.from({length:16},()=>`<i class="pt" style="left:${Math.random()*100}cqw;animation-duration:${6+Math.random()*6}s;animation-delay:-${Math.random()*8}s"></i>`).join(''));st.insertAdjacentHTML('beforeend',`<span class="chip">${sc.cap.split('—')[0].trim().toUpperCase()}</span><div class="pg" style="animation-duration:${d}s"></div>`);
 [...tb.children].forEach((b,j)=>b.classList.toggle('on',j==i&&j<S.length&&!auto?true:(j==i&&auto)));
 pa.classList.toggle('on',auto);
 let css='',p=x=>(x/d*100).toFixed(2);
 st.querySelectorAll('[data-r]').forEach((e,k)=>{const s=+e.dataset.r,g=e.dataset.k=='g',n='r'+k;
  css+=`@keyframes ${n}{0%,${p(s)}%{opacity:0;transform:${g?'scaleY(0)':'translateY(3cqw) scale(.92)'}}${p(s+.9)}%,${p(d-.4)}%{opacity:1;transform:none}100%{opacity:0}}`;
  e.style.animation=`${n} ${d}s ${g?'ease-out':'cubic-bezier(.2,1.25,.4,1)'} infinite`});
 kf.textContent=css;t0=performance.now()}
function tick(now){const sc=S[cur],el=(now-t0)/1000,t=el%sc.d;
 st.querySelectorAll('[data-n]').forEach(e=>{const a=+e.dataset.a,b=+e.dataset.b,f=+(e.dataset.f||0),n=+e.dataset.n,dc=+(e.dataset.d||0);
  const q=Math.min(1,Math.max(0,(t-a)/(b-a))),v=f+(n-f)*(1-Math.pow(1-q,3));
  e.textContent=(dc?v.toFixed(dc):Math.round(v))+(e.dataset.s||'')});
 if(auto&&el>=sc.d)load((cur+1)%S.length);
 requestAnimationFrame(tick)}
load(0);requestAnimationFrame(tick);
</script></body></html>
